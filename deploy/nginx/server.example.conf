server {
    server_name sulfur.peakora.cc;
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    http2 on;

    ssl_certificate "/etc/nginx/ssl/peakora/fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/peakora/privkey.pem";
    ssl_trusted_certificate "/etc/nginx/ssl/peakora/fullchain.pem";

    location ^~ /api/v1/network/connection-lifecycle/ {
        client_max_body_size 0;
        client_body_timeout 1h;
        client_body_buffer_size 1m;
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
        send_timeout 1h;
        grpc_socket_keepalive on;
        grpc_buffer_size 1m;
        grpc_set_header Connection "";
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $remote_addr;
        grpc_set_header X-Forwarded-Proto $scheme;
        access_log off;
        error_log /dev/null crit;
        gzip off;
        grpc_pass grpc://127.0.0.1:8444;
    }

    location ^~ /api/v1/network/edge-routing/ {
        client_max_body_size 0;
        client_body_timeout 1h;
        client_body_buffer_size 1m;
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
        send_timeout 1h;
        grpc_socket_keepalive on;
        grpc_buffer_size 1m;
        grpc_set_header Connection "";
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $remote_addr;
        grpc_set_header X-Forwarded-Proto $scheme;
        access_log off;
        error_log /dev/null crit;
        gzip off;
        grpc_pass grpc://127.0.0.1:8445;
    }

    include /etc/nginx/snippets/peakora-node.conf;
}

server {
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
